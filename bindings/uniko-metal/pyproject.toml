[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "uniko-metal"
dynamic = ["version"]
description = "Python bindings for uniko cognitive memory (ONNX + Apple Metal/CoreML)"
authors = [
    { name = "Dragonscale Industries Inc.", email = "dev@dragonscale.ai" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "pydantic>=2",
]

[project.urls]
Homepage = "https://www.rustic.ai"
Documentation = "https://rustic-ai.github.io/uniko"
Repository = "https://github.com/rustic-ai/uniko"

[tool.maturin]
# Same import path as the CPU wheel — `import uniko` — so only one variant can
# be installed at a time. `python-source` reuses the canonical package copied in
# by scripts/bootstrap-wheel-variants.sh.
module-name = "uniko._uniko"
python-source = "python"
