name: Deploy Documentation

# Publishes the website/ docs to GitHub Pages. The site is pure static
# Markdown (Zensical) — no Rust build, notebooks, or uni-db checkout needed.
#
# The build also regenerates the PEP 503 package index under
# website/docs/packages/ from the repo's GitHub release assets, so newly
# released wheels become pip-installable without a manual edit. The release
# workflow calls this workflow (workflow_call) after attaching wheels to a
# release; it is also published on any website/ change and on manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/ci/gen_package_index.py'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('website/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install documentation dependencies
        run: pip install "zensical>=0.0.45,<0.1" "pymdown-extensions>=10.21,<11"

      - name: Generate package index from GitHub releases
        # Writes website/docs/packages/ (gitignored) so the built site serves an
        # up-to-date PEP 503 index over the release-hosted wheels. Uses only the
        # standard library; GITHUB_TOKEN just raises the API rate limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/gen_package_index.py

      - name: Build documentation
        run: |
          cd website
          zensical build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
