# Release pipeline: publish the workspace crates to crates.io and the `uniko`
# Python wheels to PyPI. Triggered by pushing a `v*` tag (e.g. `v0.1.0`).
#
# Validation (dry-run + wheel/sdist builds) runs unconditionally on every tag.
# The actual publishes are gated behind the `release` GitHub Environment — they
# wait for a manual approval before anything reaches crates.io / PyPI. Until you
# approve, a tag run only validates and uploads downloadable artifacts.
#
# Authentication is OIDC Trusted Publishing for BOTH registries — no API tokens
# are stored in the repo. One-time setup (trusted publishers on crates.io/PyPI
# and the `release` environment) is documented in RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # manual re-run for rehearsal

# Least privilege at the top; jobs that publish re-declare `id-token: write`.
permissions:
  contents: read

# One release run per tag; a newer push to the same ref cancels the older run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Dependency-ordered: each crate's internal deps must already be on crates.io
  # (or published earlier in the same run) before it can be published.
  PUBLISH_ORDER: "uniko-store uniko-pipes uniko-extract uniko-cortex uniko-memory uniko-api"

jobs:
  # ── Verify the tag matches the workspace version, then export it ───────────
  guard:
    name: Guard tag vs workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Compare tag to Cargo workspace version
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # A pre-release suffix (v0.1.0-rc.1) is allowed for rehearsal: compare
          # only the base version, since the wheel/crate version is always the
          # workspace version regardless of the tag suffix.
          base="${tag%%-*}"
          ver="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          echo "tag=$tag base=$base workspace=$ver"
          if [ "$base" != "$ver" ]; then
            echo "::error::tag '$tag' (base '$base') does not match workspace version '$ver' in Cargo.toml"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  # ── Always-on packaging validation (no registry writes) ───────────────────
  validate-crates:
    name: Validate crate packaging (dry-run)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Dry-run publish the leaf crate
        # Only the leaf (no internal deps) can be FULLY dry-run published — it
        # is the one crate whose packaged form resolves against crates.io as-is.
        run: cargo publish -p uniko-store --dry-run --locked

      - name: Package remaining crates (manifest/file validation)
        # Downstream crates cannot be dry-run published: their packaged form
        # depends on `uniko-store 0.1.0` (etc.) which is not on crates.io until
        # the real publish. `--no-verify` validates the manifest + packaged file
        # list without the compile-the-package step. Full chain verification
        # only happens during the real, ordered publish below.
        run: |
          set -euo pipefail
          for crate in uniko-pipes uniko-extract uniko-cortex uniko-memory uniko-api; do
            echo "::group::cargo package -p $crate --no-verify"
            cargo package -p "$crate" --no-verify --locked --allow-dirty
            echo "::endgroup::"
          done

  # ── Build platform wheels (abi3 → one wheel per platform, py3.10+) ─────────
  build-wheels:
    name: Wheel ${{ matrix.os }}/${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: manylinux_2_28 }
          # aarch64 builds on a NATIVE ARM runner, not an x86_64 cross-build:
          # `ort` (ONNX Runtime) only links from pyke's prebuilt binaries, which
          # are fetched per host arch. A native runner pulls the aarch64 ORT
          # bundle inside the ARM manylinux container — no QEMU, no cross-link.
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: manylinux_2_28 }
          # macOS is aarch64-only: ort rc.12 ships no x86_64-apple-darwin binary,
          # and our onnx feature is always-on, so an Intel-macOS wheel cannot
          # link. Intel Macs are EOL — drop x86_64 rather than build ORT from src.
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v6

      # Non-Linux runners build on the host (no container): install protoc and a
      # Python interpreter directly. Linux uses the manylinux container, handled
      # by `before-script-linux` below.
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.10"

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --strip --out dist -m bindings/uniko-py/Cargo.toml
          sccache: "true"
          # Runs inside the manylinux container before the build. Each Linux
          # target now builds on a native runner (x86_64 and ubuntu-24.04-arm),
          # so protoc must match the container arch — select it from `uname -m`.
          before-script-linux: |
            set -eux
            PB_VERSION=29.3
            case "$(uname -m)" in
              x86_64)  PB_ARCH=x86_64 ;;
              aarch64) PB_ARCH=aarch_64 ;;
              *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
            esac
            dnf install -y unzip || yum install -y unzip
            curl -fsSL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VERSION}/protoc-${PB_VERSION}-linux-${PB_ARCH}.zip"
            unzip -o /tmp/protoc.zip -d /usr/local
            protoc --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ── Build the source distribution ─────────────────────────────────────────
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m bindings/uniko-py/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── Build the CUDA (NVIDIA) wheel variant — `uniko-cuda`, Linux x86_64 ─────
  # Full ONNX+CUDA+LLM: `gpu-cuda` enables `ort/cuda` (a prebuilt ORT CUDA EP
  # sidecar via pyke) AND, together with the `mistralrs`+`candle` features,
  # compiles candle's CUDA kernels for local mistralrs LLM inference. That kernel
  # compile needs the CUDA toolkit (nvcc) at build time, so we install
  # cuda-toolkit-12-4 into the manylinux_2_28 (AlmaLinux 8) container and build
  # PTX for CUDA_COMPUTE_CAP=80 (Ampere; PTX forward-JITs onto Ada/Hopper/
  # Blackwell at first run). cudarc dynamic-loads the runtime libs, so only
  # build-time nvcc/headers are needed here. maturin's auditwheel is skipped,
  # then a manual `auditwheel repair` excludes the host CUDA/cuDNN libs so they
  # resolve at runtime instead of bloating the wheel (mirrors rustic-ai/uni-db).
  # NOTE: unverified end-to-end — rehearse via workflow_dispatch on a -rc tag
  # before a real release; candle+CUDA is a long compile (tens of minutes).
  build-cuda-linux:
    name: Wheel uniko-cuda (linux/x86_64, CUDA)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bootstrap variant Python sources
        run: ./scripts/bootstrap-wheel-variants.sh

      - name: Build wheel (skip maturin auditwheel)
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: "" # clear any repo linker overrides absent in the container
          # candle's bindgen_cuda compiles kernels for this arch; without it (and
          # no GPU in CI to auto-detect) the build fails. sm_80 (Ampere) PTX
          # forward-JITs onto newer archs at first run — one build covers Ampere+.
          CUDA_COMPUTE_CAP: "80"
          # Point candle/cudarc at the toolkit installed by before-script-linux.
          CUDA_ROOT: /usr/local/cuda
          CUDA_PATH: /usr/local/cuda
        with:
          target: x86_64
          manylinux: "2_28"
          args: --release --strip --auditwheel skip --out dist-raw -m bindings/uniko-cuda/Cargo.toml
          sccache: "true"
          before-script-linux: |
            set -eux
            # ── CUDA toolkit (nvcc + headers) for the candle/mistralrs kernel
            # build. manylinux_2_28 is AlmaLinux 8, so use NVIDIA's rhel8 repo.
            # Full toolkit for reliability; can be slimmed to
            # `cuda-nvcc-12-4 cuda-cudart-devel-12-4` once the minimal set is
            # confirmed to compile candle. cudarc dynamic-loads the runtime libs,
            # so only build-time nvcc/headers are needed inside the container.
            dnf install -y dnf-plugins-core || yum install -y yum-utils
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo \
              || yum-config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf install -y cuda-toolkit-12-4 || yum install -y cuda-toolkit-12-4
            # Symlink nvcc onto a dir already in PATH so the maturin build finds it
            # regardless of whether before-script env exports persist to the build.
            ln -sf /usr/local/cuda/bin/nvcc /usr/bin/nvcc
            nvcc --version
            # ── OpenSSL 1.1 staging (unchanged): stage the container's OpenSSL 1.1
            # libs into the bind-mounted workspace so the host-runner auditwheel
            # repair (OpenSSL 3 only) can bundle libcrypto/libssl.so.1.1 that the
            # ORT CUDA EP links against.
            yum install -y openssl-devel unzip
            mkdir -p "$GITHUB_WORKSPACE/_cudahostlibs"
            cp -av /usr/lib64/libcrypto.so.1.1* /usr/lib64/libssl.so.1.1* "$GITHUB_WORKSPACE/_cudahostlibs/" 2>/dev/null || true
            PB_VERSION="28.3"
            curl -fsSL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VERSION}/protoc-${PB_VERSION}-linux-x86_64.zip"
            unzip -o /tmp/protoc.zip -d /usr/local
            protoc --version

      - name: Repair wheel (exclude host CUDA/cuDNN libs)
        run: |
          set -euo pipefail
          pip install auditwheel patchelf
          mkdir -p dist
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/_cudahostlibs:${LD_LIBRARY_PATH:-}"
          for whl in dist-raw/*.whl; do
            auditwheel repair \
              --plat manylinux_2_28_x86_64 \
              --wheel-dir dist \
              --exclude 'libcuda.so.*' \
              --exclude 'libcudart.so.*' \
              --exclude 'libcublas.so.*' \
              --exclude 'libcublasLt.so.*' \
              --exclude 'libcurand.so.*' \
              --exclude 'libcudnn.so.*' \
              --exclude 'libnvrtc.so.*' \
              --exclude 'libnvJitLink.so.*' \
              "$whl"
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-uniko-cuda-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  # ── Build the Metal (Apple Silicon) wheel variant — `uniko-metal` ─────────
  # `gpu-metal` enables `ort?/coreml` (fires because the uni-db pin always
  # enables `provider-onnx`); CoreML is statically linked in pyke's macOS ORT
  # bundle, so no sidecar/auditwheel dance. The `mistralrs`+`candle` features
  # additionally compile candle's Metal kernels for local LLM inference — the
  # macos-14 runner's Xcode/Metal SDK supplies that toolchain, so no extra
  # install is needed. macOS arm64 only (no x86_64-apple-darwin ORT prebuilt).
  build-metal:
    name: Wheel uniko-metal (macos/aarch64, Metal)
    runs-on: macos-14
    needs: guard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protobuf
        run: brew install protobuf

      - name: Bootstrap variant Python sources
        run: ./scripts/bootstrap-wheel-variants.sh

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --strip --out dist -m bindings/uniko-metal/Cargo.toml
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-uniko-metal-macos-aarch64
          path: dist/*.whl
          if-no-files-found: error

  # ── GATED: publish crates to crates.io (OIDC, dependency order) ────────────
  publish-crates:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    needs: [guard, validate-crates]
    environment: release # manual-approval gate
    permissions:
      id-token: write # OIDC token exchange with crates.io
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in $PUBLISH_ORDER; do
            echo "::group::cargo publish -p $crate"
            # cargo publish blocks until the crate is index-available before
            # returning (default since cargo 1.66), so the next crate in the
            # chain resolves correctly.
            cargo publish -p "$crate" --locked
            echo "::endgroup::"
          done

  # ── GATED: publish wheels + sdist to PyPI (OIDC) ──────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [guard, build-wheels, build-sdist, build-cuda-linux, build-metal]
    environment: release # manual-approval gate
    permissions:
      id-token: write # OIDC token exchange with PyPI
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ── GATED: attach artifacts to the GitHub Release ─────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-crates, publish-pypi]
    permissions:
      contents: write # create the release + upload assets
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
