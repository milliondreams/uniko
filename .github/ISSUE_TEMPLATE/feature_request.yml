name: Feature request
description: Suggest an idea or enhancement for uniko
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to uniko.

        Please search [existing issues](https://github.com/rustic-ai/uniko/issues) and
        [Discussions](https://github.com/rustic-ai/uniko/discussions) first to see if your
        idea has already been raised.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? Is your request related to a frustration or limitation? Please describe.
      placeholder: I'm always frustrated when ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, references, or screenshots about the feature request here.
    validations:
      required: false
