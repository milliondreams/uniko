[workspace]
resolver = "2"
members = [
    "crates/uniko-store",
    "crates/uniko-pipes",
    "crates/uniko-extract",
    "crates/uniko-memory",
    "crates/uniko-cortex",
    "crates/uniko-api",
    "crates/uniko-fs",
    "crates/uniko-shell",
    "crates/uniko-mcp",
    "bindings/uniko-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
uniko-store = { path = "crates/uniko-store" }
uniko-pipes = { path = "crates/uniko-pipes" }
uniko-extract = { path = "crates/uniko-extract" }
uniko-memory = { path = "crates/uniko-memory" }
uniko-cortex = { path = "crates/uniko-cortex" }
uniko-api = { path = "crates/uniko-api" }

# Database
uni-db = { path = "../projectX/uni-db/crates/uni", default-features = false, features = [
    "lance-backend",
    "provider-fastembed",
    "snapshot-internals",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Identifiers
uuid = { version = "1", features = ["v7"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Observability
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Code parsing
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

# ML / embedding
ort = "2.0.0-rc.11"
fastembed = "5"
tiktoken-rs = "0.6"

# Python binding
pyo3 = { version = "0.23", features = ["extension-module"] }

# Dev dependencies
proptest = "1"

# ── Dev profile: optimize inference-heavy deps so tests don't crawl ──
[profile.dev.package.fastembed]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
