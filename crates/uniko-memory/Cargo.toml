[package]
name = "uniko-memory"
description = "Layer 4: Memory management — pipelines, recall cascade, rules, consolidation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uniko-cortex = { workspace = true }
uniko-extract = { workspace = true }
uniko-pipes = { workspace = true }
uniko-store = { workspace = true }
uni-db = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
lru = { workspace = true }

[features]
onnx = ["uniko-extract/onnx"]
# Enable the abstractive (LLM-rewritten) path for F59 summaries. When
# absent, summary generation stays deterministic/extractive and offline.
llm = ["uniko-cortex/llm"]
