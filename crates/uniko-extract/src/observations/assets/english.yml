# Default observation extraction rules for English.
#
# Loaded once at startup by `rules_engine::load_bundled_rules()`. The
# matcher walks each sentence's DEP tree and, for every token whose
# POS matches a pattern's anchor, tests the children list. When the
# required arcs are present, captured spans are rendered through the
# template into the observation `content`.
#
# To experiment without a rebuild, point `UnikoConfig.observation_rules_path`
# at a sibling YAML; the matcher will load that file instead.

subject_resolution:
  first_person:
    tokens: [i, we, me, my, myself]
    contraction_prefixes: ["i'", "we'", "i’", "we’"]
  second_person:
    tokens: [you, your, yours, yourself]
    contraction_prefixes: ["you'", "you’"]
  third_person_demonstrative:
    tokens: [it, "it's", "it'd", "it'll", this, that, they, there]
  unresolvable:
    tokens:
      - which
      - who
      - whom
      - whose
      - what
      - where
      - when
      - why
      - how
      - anyone
      - anybody
      - anything
      - everyone
      - everybody
      - everything
      - someone
      - somebody
      - something
      - "no one"
      - nobody
      - nothing
      - others
      - another
      - all
      - some
      - few
      - many
      - most
      - it
      - this
      - that
      - they
      - there
      - these
      - those

filters:
  min_content_words: 3
  subject_pos_required: [NOUN, PROPN, PRON]
  drop_when_subject_unresolvable: true

  # Multi-label CLS gate. The model emits a softmax over 8 raw labels;
  # the gate accepts a sentence if any label with prob > min_prob is in
  # informative_labels. Tuned for high-recall extraction: a sentence
  # whose argmax is `social` but whose `inform`/`status` mass clears
  # 20% (e.g. "I was so happy and thankful for all the support" — both
  # social and a self-status report) still gets extracted.
  cls_gate:
    min_prob: 0.20
    informative_labels: [inform, status, request, offer]

phrase_collectors:
  noun_phrase:
    include_relations: [compound, amod, flat, "flat:name", "nmod:poss", det, nummod]
  noun_phrase_full:
    include_relations: [compound, amod, flat, "flat:name", "nmod:poss", det, nummod, appos, nmod]
  subtree:
    subtree: true

patterns:
  # Parity port of the legacy copular branch:
  #   "Caroline is happy", "mom has been supportive".
  - name: copular_state
    description: "ADJ/NOUN predicate with a `cop` child"
    match:
      anchor:
        pos: [ADJ, NOUN]
        children:
          - dep: cop
            required: true
          - dep: [nsubj, "nsubj:pass", csubj]
            required: true
            capture: subject
            collect: noun_phrase
          - dep: [obj, dobj, iobj]
            capture: object
            collect: noun_phrase
          - dep: [obl, advmod, xcomp, advcl]
            capture: modifiers
            collect: subtree
            multi: true
    template: "{subject} is {anchor} {object} {modifiers}"

  # Parity port of the legacy verbal branch:
  #   "Jon got a temp job", subject-verb-object with optional modifiers.
  - name: verbal_action
    description: "VERB predicate with subject + optional object/modifiers"
    match:
      anchor:
        pos: VERB
        children:
          - dep: [nsubj, "nsubj:pass", csubj]
            required: true
            capture: subject
            collect: noun_phrase
          - dep: [obj, dobj, iobj]
            capture: object
            collect: noun_phrase
          - dep: [obl, advmod, xcomp, advcl]
            capture: modifiers
            collect: subtree
            multi: true
    template: "{subject} {anchor} {object} {modifiers}"

  # Phase B: pattern for "It'll be tough as a single parent" /
  #   "important after that tough breakup" — anchors with a subject and
  #   a meaningful PP-attached noun phrase (`obl`) but no `obj`. The
  #   modifier collector walks deeper (appos + nmod) to keep
  #   "single parent", "tough breakup".
  - name: oblique_state_modifier
    description: "Anchor with PP-attached state, no direct object"
    match:
      anchor:
        pos: [ADJ, NOUN, VERB]
        children:
          - dep: [nsubj, "nsubj:pass"]
            required: true
            capture: subject
            collect: noun_phrase
          - dep: obl
            required: true
            capture: modifier
            collect: noun_phrase_full
    template: "{subject} {anchor} {modifier}"
    quality:
      min_modifier_words: 2

  # Phase B: pattern for "my home country, Sweden" — appositional
  #   identifier renames the anchor noun. Emits
  #   "<speaker>: <anchor> = <identifier>". The `{subject}` default
  #   resolves to the speaker (matcher inserts it into captures), so
  #   the resulting observation embeds with a Caroline/Melanie signal.
  #   Without this, the apposition obs has zero subject token and
  #   ranks well below subject-prefixed observations on queries that
  #   mention the speaker.
  - name: appositional_identity
    description: "Apposition-based identity claim"
    match:
      anchor:
        pos: [NOUN, PROPN]
        children:
          - dep: appos
            required: true
            capture: identifier
            collect: noun_phrase
    template: "{subject}: {anchor} = {identifier}"

# SRL-anchored patterns. Each runs against every SrlFrame on
# NlpResult.srl_frames (one per recognised verb predicate). PropBank
# role labels: ARG0=agent, ARG1=theme/object, ARG2..ARG4=role-specific
# (recipient, beneficiary, source, destination), ARGM-TMP=time,
# ARGM-LOC=location, ARGM-MNR=manner, ARGM-CAU=cause, etc.
#
# `{predicate}` is auto-injected from the frame; `{subject}` defaults
# to the speaker so templates can always reference it.
srl_patterns:
  # Clean SVO from any verb frame with a recognised agent and theme.
  # Emits the most-specific applicable template — e.g. with both
  # ARGM-TMP and ARGM-LOC present, the *fully-modified* template wins.
  # The renderer skips alternatives whose referenced captures are
  # empty, so missing roles silently degrade to the next-best shape.
  - name: srl_action
    description: >
      ARG0 + V + ARG1 (+ optional ARG2 recipient / ARG3 source /
      ARG4 destination / ARGM-TMP / ARGM-LOC).  PropBank assigns the
      non-core arg numbers per-verb: motion verbs use ARG4 for
      destination and ARG3 for source; transfer verbs use ARG2 for
      recipient.  Capturing all three lets ditransitives like "Caroline
      gave Melanie a necklace" survive without inventing one rule per
      verb class.
    captures:
      - role: ARG0
        as: agent
        required: true
      - role: ARG1
        as: theme
        required: true
      - role: ARG2
        as: recipient
      - role: ARG3
        as: source
      - role: ARG4
        as: destination
      - role: ARGM-TMP
        as: time
      - role: ARGM-LOC
        as: location
    template: "{agent} {predicate} {theme}"
    template_alternatives:
      # Theme + one non-core argument.
      - "{agent} {predicate} {theme} {recipient}"
      - "{agent} {predicate} {theme} {destination}"
      - "{agent} {predicate} {theme} {source}"
      # Theme + time / location.
      - "{agent} {predicate} {theme} {time}"
      - "{agent} {predicate} {theme} {location}"
      - "{agent} {predicate} {theme} {time} {location}"
      # Theme + non-core + time.
      - "{agent} {predicate} {theme} {recipient} {time}"
      - "{agent} {predicate} {theme} {destination} {time}"
      - "{agent} {predicate} {theme} {source} {time}"
      # Theme + non-core + location.
      - "{agent} {predicate} {theme} {recipient} {location}"
      - "{agent} {predicate} {theme} {destination} {location}"
      # Theme + destination + time + location (longest reasonable shape).
      - "{agent} {predicate} {theme} {destination} {time} {location}"

  # Frames whose ARG1/theme is implicit (intransitive verb) but with a
  # bound time — e.g. *"I left yesterday"*. Lower-precision than
  # `srl_action` but useful for temporal-anchored events.
  - name: srl_action_temporal_only
    description: "ARG0 + V + ARGM-TMP, no ARG1"
    captures:
      - role: ARG0
        as: agent
        required: true
      - role: ARGM-TMP
        as: time
        required: true
    template: "{agent} {predicate} {time}"

  # Symmetric to the temporal-only pattern: intransitive verb with a
  # bound location.
  - name: srl_action_locative_only
    description: "ARG0 + V + ARGM-LOC, no ARG1"
    captures:
      - role: ARG0
        as: agent
        required: true
      - role: ARGM-LOC
        as: location
        required: true
    template: "{agent} {predicate} {location}"

  # Motion verbs with an ARG4 destination but no ARG1 theme — e.g.
  # *"I went to the LGBTQ support group yesterday"*.  PropBank tags
  # the destination of go/come/travel/move/etc. as ARG4 rather than
  # ARG1; without this pattern the destination is silently lost.
  - name: srl_action_directional
    description: "ARG0 + V + ARG4 destination (+ optional ARGM-TMP / ARGM-LOC)"
    captures:
      - role: ARG0
        as: agent
        required: true
      - role: ARG4
        as: destination
        required: true
      - role: ARGM-TMP
        as: time
      - role: ARGM-LOC
        as: location
    template: "{agent} {predicate} {destination}"
    template_alternatives:
      - "{agent} {predicate} {destination} {time}"
      - "{agent} {predicate} {destination} {location}"
      - "{agent} {predicate} {destination} {time} {location}"

  # Speech / transfer verbs whose primary complement is an addressee
  # rather than a theme — e.g. *"Caroline spoke to Melanie"*. PropBank
  # tags the addressee as ARG2 for these verbs.
  - name: srl_action_recipient_only
    description: "ARG0 + V + ARG2 recipient, no ARG1"
    captures:
      - role: ARG0
        as: agent
        required: true
      - role: ARG2
        as: recipient
        required: true
      - role: ARGM-TMP
        as: time
    template: "{agent} {predicate} {recipient}"
    template_alternatives:
      - "{agent} {predicate} {recipient} {time}"

  # Motion verbs with a start point (ARG3) but no destination/theme —
  # e.g. *"Caroline came from the kitchen"*.
  - name: srl_action_source_only
    description: "ARG0 + V + ARG3 source, no ARG1"
    captures:
      - role: ARG0
        as: agent
        required: true
      - role: ARG3
        as: source
        required: true
      - role: ARGM-TMP
        as: time
    template: "{agent} {predicate} {source}"
    template_alternatives:
      - "{agent} {predicate} {source} {time}"
