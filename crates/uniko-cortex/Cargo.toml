[package]
name = "uniko-cortex"
description = "Layer 5: Higher reasoning — procedure promotion and topic detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
uniko-store = { workspace = true }
uni-db = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Path-only (NO version) on purpose: uniko-memory depends on uniko-cortex, so a
# versioned dev-dep here would be an unpublishable cycle (uniko-memory isn't on
# crates.io when uniko-cortex publishes). cargo drops version-less dev-deps from
# the published manifest, so this keeps `cargo test` working while letting
# uniko-cortex publish ahead of uniko-memory. Do NOT switch to `workspace = true`
# (that inherits version = "0.1.0" and re-breaks the ordered publish).
uniko-memory = { path = "../uniko-memory" }
uni-db = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
default = []
llm = []
