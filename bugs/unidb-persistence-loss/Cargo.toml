[package]
name = "unidb-persistence-loss-repro"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone reproduction crate.  Not part of the uniko2 workspace —
# kept isolated so it can be lifted out and shared with rustic-ai/uni-db
# as a self-contained bug report.
[workspace]

[dependencies]
uni-db = { path = "../../../uni/crates/uni" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[[bin]]
name = "repro"
path = "repro.rs"

[[bin]]
name = "repro_conv26"
path = "repro_conv26.rs"
